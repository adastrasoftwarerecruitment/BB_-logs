<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battery Service Log</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6b66">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#e8edee;--card:#fff;--ink:#101c24;--sub:#5a6b75;--line:#c9d3d7;--acc:#0b6b66;--accink:#fff;--draft:#b7791f;--ok:#1f8450;--bad:#b42318;--field:#f6f9f9}
@media(prefers-color-scheme:dark){:root{--bg:#0e171b;--card:#16242a;--ink:#e6eef0;--sub:#93a6ae;--line:#2c3f47;--acc:#3fb8b0;--accink:#06201f;--draft:#e0a73c;--ok:#4cc585;--bad:#ff8a7a;--field:#101c21}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;padding:0 12px calc(96px + env(safe-area-inset-bottom))}
a{color:var(--acc)}
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:19px;margin:0;flex:1;letter-spacing:-.01em}
.back,.gear{text-decoration:none;font-size:24px;line-height:1;color:var(--ink);padding:4px 8px;margin:-4px -4px}
.role{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.role.editor{border-color:var(--acc);color:var(--acc)}
.tabs{display:flex;gap:6px;margin:4px 0 10px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit}
.tabs button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:4px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:1px}
input[readonly],input:disabled,select:disabled,textarea:disabled{opacity:.75}
label{display:block;font-size:13px;color:var(--sub)}
label small{color:var(--sub);opacity:.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wide{grid-column:1/-1}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bn{font-size:18px}
.sub,.meta{font-size:13px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap;margin-top:3px}
.cells{display:inline-flex;gap:3px;padding:3px;border:2px solid var(--sub);border-radius:5px;position:relative;margin-right:5px}
.cells::after{content:"";position:absolute;right:-6px;top:6px;width:4px;height:8px;background:var(--sub);border-radius:0 2px 2px 0}
.c{display:block;width:16px;height:12px;border-radius:2px;border:1px solid var(--line)}
.c.submitted{background:var(--ok);border-color:var(--ok)}
.c.draft{background:repeating-linear-gradient(135deg,var(--draft) 0 3px,transparent 3px 6px);border-color:var(--draft)}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.badge.draft{color:var(--draft);border-color:var(--draft)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.steps{display:flex;gap:6px;margin:6px 0 14px;overflow-x:auto}
.steps a{flex:1;min-width:78px;text-align:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;font-size:14px}
.steps a.on{border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
.steps i{display:block;height:5px;border-radius:3px;margin-bottom:6px;background:var(--line)}
.steps i.submitted{background:var(--ok)}
.steps i.draft{background:repeating-linear-gradient(135deg,var(--draft) 0 4px,transparent 4px 8px)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:640px;margin:0 auto}
button.b{flex:1;padding:13px;border-radius:12px;border:1px solid var(--acc);background:transparent;color:var(--acc);font:inherit;font-weight:600}
button.b.p{background:var(--acc);color:var(--accink)}
button.b.d{border-color:var(--bad);color:var(--bad)}
button.b:disabled{opacity:.5}
.fab{position:fixed;right:max(14px,calc(50% - 306px));bottom:calc(18px + env(safe-area-inset-bottom));background:var(--acc);color:var(--accink);border:0;border-radius:99px;padding:14px 20px;font:inherit;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);text-decoration:none}
.note{padding:10px 12px;border-radius:10px;border:1px solid var(--draft);color:var(--ink);background:color-mix(in srgb,var(--draft) 12%,transparent);margin:10px 0;font-size:14px}
.note.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.hint{display:block;font-size:12px;min-height:16px;color:var(--bad);margin-top:3px}
.blank{text-align:center;color:var(--sub);padding:28px 8px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:none;z-index:9;white-space:pre-line}
#toast.bad{background:var(--bad);color:#fff}
details{margin-top:14px;font-size:14px}summary{color:var(--sub);cursor:pointer}
.mini{margin-top:12px;display:flex;gap:8px;justify-content:center}
.mini .b{flex:none;padding:10px 16px}
@media(prefers-reduced-motion:no-preference){#toast{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="xlsx.mini.min.js"></script>
<script>
const ST=['inward','problem','solution','outward'],LBL={inward:'Inward',problem:'Problem',solution:'Solution',outward:'Outward'};
const MEAS=[['date','Date','d'],['pack_voltage','Pack voltage (V)','n'],['max_string_voltage','Max string voltage (V)','n'],['max_string_no','Max string no.','i'],['min_string_voltage','Min string voltage (V)','n'],['min_string_no','Min string no.','i'],['max_temp','Max temp (°C)','n'],['min_temp','Min temp (°C)','n'],['diff_voltage','Diff voltage (V)','n'],['fuel_gauge','Fuel gauge o/p','t'],['soc','SOC (%)','n'],['capacity_ah','Battery capacity (Ah)','n'],['ip67_psi','IP67 test (psi)','n']];
const FIELDS={inward:MEAS,problem:[['description','Problem description','t']],solution:[['solution','Solution proposed','t'],['solved','Problem solved','t']],outward:[...MEAS,['status','Status','t']]};
const lab=(s,k,l)=>k==='date'?LBL[s]+' date':l;
const STATUSES=['Serviced - OK','Serviced - with remarks','Not repairable','Returned as is'];
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let cfg={url:localStorage.getItem('bl_url')||'',key:localStorage.getItem('bl_key')||'',role:localStorage.getItem('bl_role')||''};

async function api(path,o={}){
  let r;
  try{r=await fetch(cfg.url.replace(/\/+$/,'')+path,{method:o.method||'GET',headers:{'X-App-Key':cfg.key,'Content-Type':'application/json'},body:o.body?JSON.stringify(o.body):undefined});}
  catch(e){throw new Error('Could not reach the relay. Check the address and your internet connection.');}
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error(j.errors?j.errors.join('\n'):(j.error||'Error '+r.status));e.status=r.status;throw e;}
  return j;
}
let tt;function toast(m,bad,ms){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',ms||3200);}
const paint=h=>{app.innerHTML=h;window.scrollTo(0,0);};
const head=(t,back)=>`<header class="top">${back?`<a class="back" href="${back}" aria-label="Back">&#8249;</a>`:''}<h1>${t}</h1><span class="role ${cfg.role}">${cfg.role==='editor'?'Editor':'View only'}</span><a class="gear" href="#/settings" aria-label="Settings">&#9881;</a></header>`;
const cells=r=>`<span class="cells" aria-hidden="true">${ST.map(s=>`<i class="c ${r.stages[s].state}"></i>`).join('')}</span>`;
const isEd=()=>cfg.role==='editor';
const fail=e=>{if(e.status===401){toast('The app key was not accepted. Check Settings.',true,5000);location.hash='/settings';}else paint(head('Error')+`<div class="note">${esc(e.message)}</div><p><a href="#/">Back to list</a></p>`);};

/* ---------- Home ---------- */
let tab='open',q='';
async function home(){
  paint(head('Battery Service Log')+'<p class="blank">Loading...</p>');
  let list;try{list=await api('/api/services?limit=1000');}catch(e){return fail(e);}
  const draw=()=>{
    const done=r=>r.current_stage==='completed';
    const f=list.filter(r=>(!q||(r.battery_no+' '+r.bms_no).toUpperCase().includes(q.toUpperCase())));
    const open=f.filter(r=>!done(r)),comp=f.filter(done),shown=tab==='open'?open:comp;
    $('#tabs').innerHTML=`<button class="${tab==='open'?'on':''}" data-t="open">In progress (${open.length})</button><button class="${tab==='done'?'on':''}" data-t="done">Completed (${comp.length})</button>`;
    $('#list').innerHTML=shown.length?shown.map(r=>{
      const cur=r.current_stage,dr=cur!=='completed'&&r.stages[cur].state==='draft';
      const o=r.stages.outward.data;
      return `<a class="card" href="#/r/${r.id}"><div class="row"><b class="bn">${esc(r.battery_no)}</b>${cells(r)}</div><div class="sub"><span>${esc(r.ref)}</span>${r.bms_no?`<span>BMS ${esc(r.bms_no)}</span>`:''}</div><div class="meta">${done(r)?`<span class="badge ok">Completed</span>${o.date?`<span>Out ${esc(o.date)}</span>`:''}${o.status?`<span>${esc(o.status)}</span>`:''}`:`<span>Next: ${LBL[cur]}</span>${dr&&isEd()?'<span class="badge draft">Draft saved</span>':''}`}</div></a>`;}).join('')
      :`<p class="blank">${q?'No battery matches that search.':tab==='open'?(isEd()?'Nothing in progress. Tap New battery to start.':'Nothing in progress.'):'No completed services yet.'}</p>`;
  };
  paint(head('Battery Service Log')+`<input id="q" type="search" placeholder="Search battery or BMS number" value="${esc(q)}" aria-label="Search"><div class="tabs" id="tabs" style="margin-top:10px"></div><div id="list"></div><div class="mini"><button class="b" id="xl">Download Excel</button></div>${isEd()?'<a class="fab" href="#/new">+ New battery</a>':''}`);
  draw();
  $('#q').oninput=e=>{q=e.target.value.trim();draw();};
  $('#tabs').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;draw();}};
  $('#xl').onclick=exportXlsx;
}

/* ---------- New ---------- */
function newRec(){
  if(!isEd())return location.hash='/';
  paint(head('New battery','#/')+`<div class="panel"><label>Battery number<input id="bn" autocomplete="off" autocapitalize="characters"></label><div style="height:12px"></div><label>BMS number<input id="bms" autocomplete="off"></label><div id="found"></div></div><div class="bar"><button class="b p" id="go">Start inward stage</button></div>`);
  let tm;
  $('#bn').oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{
    const v=$('#bn').value.trim();if(!v){$('#found').innerHTML='';return;}
    try{const rs=await api('/api/services?battery_no='+encodeURIComponent(v));
      if(v!==$('#bn').value.trim())return;
      $('#found').innerHTML=rs.length?`<div class="note"><b>Already in the log.</b> ${rs.length} earlier record${rs.length>1?'s':''} for this battery${rs.some(r=>r.current_stage!=='completed')?'. One is unfinished, so continue it instead of starting a new one.':'.'}</div>`+rs.map(r=>`<a class="card" href="#/r/${r.id}"><div class="row"><b>${esc(r.ref)}</b>${cells(r)}</div><div class="meta"><span>In ${esc(r.stages.inward.data.date||'-')}</span><span>Out ${esc(r.stages.outward.data.date||'-')}</span><span>${r.current_stage==='completed'?esc(r.stages.outward.data.status||'Completed'):'Next: '+LBL[r.current_stage]}</span></div></a>`).join(''):'<div class="note ok">New battery. No earlier service found.</div>';
    }catch(e){$('#found').innerHTML='';}
  },350);};
  $('#go').onclick=async()=>{
    const bn=$('#bn').value.trim();if(!bn)return toast('Enter the battery number',true);
    $('#go').disabled=true;
    try{const r=await api('/api/services',{method:'POST',body:{battery_no:bn,bms_no:$('#bms').value}});location.hash='/r/'+r.id;}
    catch(e){toast(e.message,true,5000);$('#go').disabled=false;}
  };
}

/* ---------- Record ---------- */
function fld(s,k,l,t,v,ro){
  const L=lab(s,k,l),dis=ro?'disabled':'',val=v==null?'':esc(v);
  if(k==='description'||k==='solution')return `<label class="wide">${L}<textarea data-k="${k}" rows="7" ${dis}>${val}</textarea></label>`;
  if(k==='solved')return `<label class="wide">${L}<select data-k="solved" ${dis}><option value="">Select</option><option value="yes"${v==='yes'?' selected':''}>Yes</option><option value="no"${v==='no'?' selected':''}>No</option></select></label>`;
  if(k==='status')return `<label class="wide">${L}<input data-k="status" list="stl" value="${val}" ${dis} autocomplete="off"><datalist id="stl">${STATUSES.map(x=>`<option value="${x}">`).join('')}</datalist></label>`;
  if(k==='diff_voltage')return `<label>${L} <small>auto</small><input data-k="diff_voltage" value="${val}" readonly tabindex="-1"></label>`;
  if(k==='ip67_psi')return `<label class="wide">${L} <small>20 to 40</small><input data-k="ip67_psi" type="number" inputmode="decimal" step="any" min="20" max="40" value="${val}" ${dis}><span class="hint" id="ipH"></span></label>`;
  const ty=t==='d'?'date':t==='t'?'text':'number';
  return `<label>${L}<input data-k="${k}" type="${ty}" ${ty==='number'?`inputmode="decimal" step="${t==='i'?1:'any'}"`:''} value="${val}" ${dis}></label>`;
}
async function record(id,sp){
  paint(head('Loading...','#/'));
  let r;try{r=await api('/api/services/'+id);}catch(e){return fail(e);}
  const stage=ST.includes(sp)?sp:(r.current_stage==='completed'?'outward':r.current_stage);
  draw(r,stage);
}
function draw(r,stage){
  const id=r.id,S=r.stages[stage],ed=isEd(),ro=!ed||S.state==='submitted';
  const data={...S.data};
  if(!ro)FIELDS[stage].forEach(([k,,t])=>{if(t==='d'&&!data[k])data[k]=today();});
  const prior=ST.slice(0,ST.indexOf(stage)).filter(s=>r.stages[s].state!=='submitted');
  let body;
  if(!ed&&S.state!=='submitted')body='<p class="blank">This stage has not been recorded yet.</p>';
  else body=`<div class="panel"><div class="grid" id="f">${FIELDS[stage].map(([k,l,t])=>fld(stage,k,l,t,data[k],ro)).join('')}</div></div>`;
  const bar=!ed?'':S.state==='submitted'?`<div class="bar"><button class="b" id="reopen">Reopen to edit</button></div>`:`<div class="bar"><button class="b" id="draft">Save draft</button><button class="b p" id="submit"${prior.length?' disabled':''}>Submit to Teams</button></div>`;
  paint(head(esc(r.battery_no),'#/')+`<div class="sub" style="margin:0 0 10px"><span>${esc(r.ref)}</span>${r.bms_no?`<span>BMS ${esc(r.bms_no)}</span>`:''}</div>
  <nav class="steps">${ST.map(s=>`<a href="#/r/${id}/${s}" class="${s===stage?'on':''}"><i class="${r.stages[s].state}"></i>${LBL[s]}</a>`).join('')}</nav>
  ${ed&&S.state==='draft'?'<div class="note">Draft saved. Nothing has been posted to Teams yet.</div>':''}
  ${ed&&S.state==='submitted'?'<div class="note ok">Submitted and posted to Teams.</div>':''}
  ${ed&&prior.length&&S.state!=='submitted'?`<div class="note">You can save a draft now. Submit the ${prior.map(s=>LBL[s]).join(', ')} stage first to submit this one.</div>`:''}
  ${body}${ed?`<details><summary>Battery details</summary><div class="grid" style="margin-top:10px"><label>Battery number<input id="mb" value="${esc(r.battery_no)}"></label><label>BMS number<input id="mm" value="${esc(r.bms_no)}"></label></div><div class="mini"><button class="b" id="msave">Save details</button><button class="b d" id="del">Delete record</button></div></details>`:''}${bar}`);
  const F=$('#f');
  if(F&&!ro){
    const g=k=>F.querySelector(`[data-k="${k}"]`);
    const upd=()=>{
      const a=g('max_string_voltage'),b=g('min_string_voltage'),d=g('diff_voltage');
      if(d)d.value=(a.value!==''&&b.value!==''&&isFinite(a.value-b.value))?Math.round((a.value-b.value)*1000)/1000:'';
      const ip=g('ip67_psi');if(ip){const v=ip.value,bad=v!==''&&(!(+v>=20)||+v>40);$('#ipH').textContent=bad?'IP67 test must be between 20 and 40 psi':'';}
    };
    F.addEventListener('input',upd);upd();
  }
  const collect=()=>{const o={};if(F)F.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value);return o;};
  const busy=b=>document.querySelectorAll('.bar button').forEach(x=>x.disabled=b);
  const save=async submit=>{
    if(submit&&!confirm(`Submit ${LBL[stage]} for ${r.battery_no} and post to Teams?`))return;
    busy(true);
    try{
      const res=await api(`/api/services/${id}/${stage}`,{method:'PUT',body:{data:collect(),submit}});
      if(submit){const t=res.teams;toast(t&&t.ok?'Submitted and posted to Teams':`Submitted and saved, but the Teams post failed (status ${t?t.status:'?'}). Check the relay.`,!(t&&t.ok),t&&t.ok?3200:7000);
        const nx=res.record.current_stage==='completed'?stage:res.record.current_stage;history.replaceState(null,'',`#/r/${id}/${nx}`);draw(res.record,nx);}
      else{toast('Draft saved');draw(res.record,stage);}
    }catch(e){toast(e.message,true,6000);busy(false);if(prior.length&&$('#submit'))$('#submit').disabled=true;}
  };
  if($('#draft'))$('#draft').onclick=()=>save(false);
  if($('#submit'))$('#submit').onclick=()=>save(true);
  if($('#reopen'))$('#reopen').onclick=async()=>{
    if(!confirm('Reopen this stage? It becomes a draft you can edit, and submitting again posts a corrected message to Teams.'))return;
    try{const res=await api(`/api/services/${id}/${stage}/reopen`,{method:'POST'});draw(res.record,stage);}catch(e){toast(e.message,true);}
  };
  if($('#msave'))$('#msave').onclick=async()=>{try{const x=await api(`/api/services/${id}/meta`,{method:'PUT',body:{battery_no:$('#mb').value,bms_no:$('#mm').value}});toast('Details saved');draw(x,stage);}catch(e){toast(e.message,true);}};
  if($('#del'))$('#del').onclick=async()=>{
    if(!confirm(`Delete ${r.battery_no} (${r.ref}) and all its stages? This cannot be undone.`))return;
    try{await api('/api/services/'+id,{method:'DELETE'});toast('Record deleted');location.hash='/';}catch(e){toast(e.message,true);}
  };
}

/* ---------- Settings ---------- */
function settings(){
  paint(head('Settings',cfg.key?'#/':'')+`<div class="panel"><label>Relay address<input id="u" value="${esc(cfg.url)}" placeholder="https://your-worker.workers.dev" autocapitalize="off" autocomplete="off"></label><div style="height:12px"></div><label>App key<input id="k" type="password" value="${esc(cfg.key)}" autocapitalize="off" autocomplete="off"></label><p class="sub">Use the editor key to enter data, or the viewer key to look at records without changing them.</p></div><div class="bar"><button class="b p" id="s">Save and connect</button></div>${cfg.key?'<div class="mini"><button class="b d" id="out">Sign out</button></div>':''}`);
  $('#s').onclick=async()=>{
    const u=$('#u').value.trim().replace(/\/+$/,''),k=$('#k').value.trim();
    if(!/^https:\/\//.test(u)||!k)return toast('Enter the relay address (starting with https://) and the app key',true,4500);
    const old={...cfg};cfg.url=u;cfg.key=k;$('#s').disabled=true;
    try{const m=await api('/api/me');cfg.role=m.role;localStorage.setItem('bl_url',u);localStorage.setItem('bl_key',k);localStorage.setItem('bl_role',m.role);toast('Connected as '+(m.role==='editor'?'editor':'viewer'));location.hash='/';route();}
    catch(e){cfg=old;toast(e.status===401?'The app key was not accepted.':e.message,true,5000);$('#s').disabled=false;}
  };
  if($('#out'))$('#out').onclick=()=>{['bl_url','bl_key','bl_role'].forEach(x=>localStorage.removeItem(x));cfg={url:'',key:'',role:''};settings();};
}

/* ---------- Excel ---------- */
async function exportXlsx(){
  const b=$('#xl');b.disabled=true;
  try{
    const rs=(await api('/api/services?limit=5000')).sort((a,c)=>a.id-c.id);
    const sub=(r,s)=>r.stages[s].state==='submitted'?r.stages[s].data:null;
    const base=r=>({'Service ref':r.ref,'Battery no.':r.battery_no,'BMS no.':r.bms_no});
    const meas=(s,d)=>{const o={};MEAS.forEach(([k,l])=>o[lab(s,k,l)]=d[k]??'');return o;};
    const inw=rs.filter(r=>sub(r,'inward')).map(r=>({...base(r),...meas('inward',sub(r,'inward'))}));
    const outw=rs.filter(r=>sub(r,'outward')).map(r=>({...base(r),...meas('outward',sub(r,'outward')),'Status':sub(r,'outward').status??''}));
    const notes=rs.filter(r=>sub(r,'problem')||sub(r,'solution')).map(r=>{const p=sub(r,'problem')||{},s=sub(r,'solution')||{};return{...base(r),'Inward date':(sub(r,'inward')||{}).date??'','Problem description':p.description??'','Solution proposed':s.solution??'','Problem solved':s.solved==='yes'?'Yes':s.solved==='no'?'No':'','Outward date':(sub(r,'outward')||{}).date??'','Status':(sub(r,'outward')||{}).status??''};});
    if(!inw.length&&!outw.length&&!notes.length){toast('Nothing submitted yet, so there is nothing to export.',true);return;}
    const wb=XLSX.utils.book_new();
    const add=(name,rows,hdr)=>{const ws=rows.length?XLSX.utils.json_to_sheet(rows):XLSX.utils.aoa_to_sheet([hdr]);const cols=Object.keys(rows[0]||{}).length?Object.keys(rows[0]):hdr;ws['!cols']=cols.map(h=>({wch:Math.max(12,String(h).length+2)}));XLSX.utils.book_append_sheet(wb,ws,name);};
    add('Inward',inw,['Service ref','Battery no.','BMS no.',...MEAS.map(([k,l])=>lab('inward',k,l))]);
    add('Outward',outw,['Service ref','Battery no.','BMS no.',...MEAS.map(([k,l])=>lab('outward',k,l)),'Status']);
    add('Service Notes',notes,['Service ref','Battery no.','BMS no.','Inward date','Problem description','Solution proposed','Problem solved','Outward date','Status']);
    XLSX.writeFile(wb,'battery-service-log-'+today()+'.xlsx');
    toast('Excel file downloaded');
  }catch(e){toast(e.message,true,5000);}finally{b.disabled=false;}
}

/* ---------- Router ---------- */
function route(){
  const h=location.hash.slice(1)||'/';
  if(h==='/settings')return settings();
  if(!cfg.key||!cfg.url)return settings();
  const m=h.match(/^\/r\/(\d+)(?:\/(\w+))?/);
  if(m)return record(+m[1],m[2]);
  if(h==='/new')return newRec();
  home();
}
window.addEventListener('hashchange',route);route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
